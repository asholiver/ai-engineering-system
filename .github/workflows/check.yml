# Repository quality gate on pull requests to main: scripts/check.sh (plugin and marketplace
# validation, bash -n, ShellCheck, the hook test suite tests/run.sh, template names, version
# consistency, context budgets). ShellCheck is mandatory here: the job fails if it is missing or
# if check.sh reports that it skipped it.
#
# No model inference and no Anthropic credentials: the Claude Code CLI is used only for the offline
# `claude plugin validate --strict` commands in check.sh (verified to pass with an empty HOME, no
# credentials and all network blocked, and to fail on a broken manifest). The check step runs with
# every HTTP(S) request sent to a dead local proxy, so nothing in it can reach a network service.
name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (ubuntu, ShellCheck 0.11.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install ShellCheck 0.11.0 (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum --check --strict -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -qx 'version: 0.11.0'

      - name: Install Claude Code CLI 2.1.296 (plugin validation only)
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.296
          claude --version | grep -q '^2\.1\.296 '

      - name: Tool versions
        run: |
          set -euo pipefail
          bash --version | head -n 1
          git --version
          jq --version
          shellcheck --version | grep '^version:'
          claude --version

      - name: Run scripts/check.sh (includes tests/run.sh and ShellCheck)
        env:
          ANTHROPIC_API_KEY: ""
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          set -euo pipefail
          # Every HTTP(S) request goes to a dead local proxy. Both spellings are set here, not in
          # `env:` above, because GitHub treats `env:` keys case-insensitively (a duplicate key error).
          export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9
          export http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9
          export NO_PROXY= no_proxy=
          # The tests put their fixture repositories in ${TMPDIR:-/tmp}. Under /tmp, cases whose literal
          # destination is /tmp/... (fix round 3 N6(c)) can reach the fixture repository itself, which
          # the guard rightly asks for; keep fixtures in the runner's temporary directory instead
          # (outside the checkout and outside /tmp), as on a developer machine.
          export TMPDIR="$RUNNER_TEMP"
          scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/check.log"
          if grep -q 'shellcheck not installed; skipped' "$RUNNER_TEMP/check.log"; then
            echo "::error::ShellCheck was skipped; it is mandatory in CI"
            exit 1
          fi
          grep -q '^CHECK: PASSED$' "$RUNNER_TEMP/check.log"
