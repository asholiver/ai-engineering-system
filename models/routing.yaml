version: 1

tiers:
  reasoning:
    provider: anthropic
    model: claude-opus-5-5
  execution:
    provider: anthropic
    model: claude-sonnet-5-5
  deterministic:
    provider: tooling
    model: null

agents:
  planning: reasoning
  orchestrator: execution
  frontend: execution
  backend: execution
  platform:
    planning: reasoning
    implementation: execution
  security: reasoning
  qa: execution
  learning: execution
